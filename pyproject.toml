[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "birdcast-uk"
version = "0.4.1"
description = "UK weather-radar bird migration historical reanalysis products."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
  {name = "Ryan R. Neely III"},
]
dependencies = []

[project.optional-dependencies]
birdcast = [
  "cdsapi>=0.7,<1",
  "earthkit-data>=1.0.2,<2",
  "duckdb>=1.0,<2",
  "ecmwf-opendata>=0.3.20",
  "h5netcdf>=1.3",
  "netCDF4>=1.6",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "tomli>=2; python_version < '3.11'",
  "xarray>=2024.1",
  "xgboost>=2.1,<4",
  "zarr>=2.16",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.12,<1",
]

[project.scripts]
birdcast-uk = "birdcast_uk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
birdcast_uk = ["static/*", "static_europe/*", "static_coastal/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
